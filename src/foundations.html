<section class="slide" data-title="Tal med form och axlar" data-level="1"><div class="si">
  <h2 data-i18n="fd.shape.title"></h2>
  <div class="cols">
    <div>
      <p data-i18n="fd.shape.intro"></p>
      <ul>
        <li data-i18n="fd.shape.scalar"></li>
        <li data-i18n="fd.shape.vector"></li>
        <li data-i18n="fd.shape.matrix"></li>
        <li data-i18n="fd.shape.tensor"></li>

      <div class="out" id="fd-shape-out" aria-live="polite"></div>
