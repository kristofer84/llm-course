name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install Playwright
        run: |
          pip install -r tests/requirements.txt
          # The browser download is what the tests need; OS packages and fonts are
          # already on the runner image, so treat install-deps as best effort and
          # bound every network step. A hung apt mirror must not stall the job.
          timeout 300 python -m playwright install chromium \
            || { sleep 15; timeout 300 python -m playwright install chromium; }
          timeout 180 python -m playwright install-deps chromium \
            || echo "::warning::install-deps failed (apt mirror), continuing: the runner image already has the libraries"

      - name: Build course HTML
        working-directory: src
        run: python3 build.py

      - name: Curriculum, saved-answer, quiz and formula contracts
        run: python3 tests/contracts.py

      - name: Smoke test (slides, overflow, JS errors, interactive controls)
        run: python3 tests/smoke.py

      - name: Click through every slide and visualisation
        run: python3 tests/test.py

      - name: Keyboard-operable diagrams in both languages
        run: python3 tests/accessibility.py

      - name: Bilingual depth, simulations and regression checks
        run: python3 tests/regressions.py

      - name: Check translation coverage, markup and code blocks
        run: python3 tools/check_i18n.py

      - name: Translation state (English behind Swedish?)
        run: python3 tools/content.py status --strict

      - name: Both languages render (no Swedish left in English mode)
        run: python3 tests/i18n.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: shots/
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build course HTML
        working-directory: src
        run: python3 build.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp llm-kurs.html _site/index.html
          cp llm-kurs.html _site/llm-kurs.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
