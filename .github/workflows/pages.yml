name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install Playwright
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Build course HTML
        working-directory: src
        run: python3 build.py

      - name: Smoke test (slides, overflow, JS errors, interactive controls)
        run: python3 tests/smoke.py

      - name: Click through every slide and visualisation
        run: python3 tests/test.py

      - name: Extract translation source strings
        run: python3 tools/extract_i18n.py

      - name: Check translation coverage, markup and code blocks
        run: python3 tools/check_i18n.py

      - name: Both languages render (no Swedish left in English mode)
        run: python3 tests/i18n.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: shots/
          retention-days: 7

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build course HTML
        working-directory: src
        run: python3 build.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp llm-kurs.html _site/index.html
          cp llm-kurs.html _site/llm-kurs.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
